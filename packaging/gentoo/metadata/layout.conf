# layout.conf for the "mx4" Portage overlay (mx-master-4-desktop).
#
# This makes packaging/gentoo a VALID STANDALONE overlay that inherits from the
# main ::gentoo tree, so atoms like dev-qt/qtbase:6, kde-plasma/layer-shell-qt
# and the eclasses (cmake, python-single-r1, systemd, udev, xdg, git-r3) are
# resolved from ::gentoo. Add it via /etc/portage/repos.conf or eselect
# repository (see the README / INSTALL notes).

# Inherit everything (eclasses, profiles, virtuals) from the main tree.
masters = gentoo

# Modern thin manifests: only DIST entries are hashed, ebuilds are verified by
# the VCS checkout, not by a per-file Manifest. `ebuild ... manifest` honours
# this automatically.
thin-manifests = true

# We do not GPG-sign this overlay's manifests.
manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B

# No metadata/md5-cache shipped; Portage regenerates it on first sync/use.
cache-formats = md5-dict

# Stable, explicit repo name (also pinned in profiles/repo_name).
repo-name = mx4
